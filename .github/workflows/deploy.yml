name: Deploy

on:
  push:
    branches: [week4]

jobs:
  checks:
    uses: ./.github/workflows/typecheck.yaml

  build:
    needs: checks
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: back
            image: todo-back
            context: ./back
          - service: front
            image: todo-front
            context: ./front

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASS }}
        run: |
          echo "$DOCKER_PASS" | docker login \
            --username "$DOCKER_USER" \
            --password-stdin

      - name: Build back image
        if: matrix.service == 'back'
        run: |
          docker build \
            -t "${{ secrets.DOCKER_USER }}/${{ matrix.image }}:sha-${{ github.sha }}" \
            -t "${{ secrets.DOCKER_USER }}/${{ matrix.image }}:latest" \
            "${{ matrix.context }}"

      - name: Build front image
        if: matrix.service == 'front'
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          docker build \
            --build-arg VITE_API_URL="$VITE_API_URL" \
            -t "${{ secrets.DOCKER_USER }}/${{ matrix.image }}:sha-${{ github.sha }}" \
            -t "${{ secrets.DOCKER_USER }}/${{ matrix.image }}:latest" \
            "${{ matrix.context }}"

      - name: Push images
        run: |
          docker push "${{ secrets.DOCKER_USER }}/${{ matrix.image }}:sha-${{ github.sha }}"
          docker push "${{ secrets.DOCKER_USER }}/${{ matrix.image }}:latest"

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/myapp
            sed -i "s|^APP_VERSION=.*|APP_VERSION=sha-${{ github.sha }}|" .env.development.compose
            docker compose --env-file .env.development.compose pull back front
             docker compose --env-file .env.development.compose up -d --no-deps back front

    # 4. Проверяем приложение после деплоя
  verify:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Smoke test deployed application
        env:
          E2E_BASE_URL: ${{ vars.VITE_API_URL }}
        run: |
          export E2E_BASE_URL="${E2E_BASE_URL%/api}"
          make smoke-deployed

    # 5. Уведомление в Telegram при любом результате
  notify:
    needs: [checks, build, deploy, verify]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          CHECKS="${{ needs.checks.result }}"
          BUILD="${{ needs.build.result }}"
          DEPLOY="${{ needs.deploy.result }}"
          VERIFY="${{ needs.verify.result }}"
            
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            
          if [ "$CHECKS" != "success" ]; then
            TEXT="❌ Type-check упал%0A${{ github.repository }} @ ${{ github.ref_name }}%0A$RUN_URL"
          elif [ "$BUILD" != "success" ]; then
            TEXT="❌ Build упал%0A${{ github.repository }} @ ${{ github.ref_name }}%0A$RUN_URL"
          elif [ "$DEPLOY" != "success" ]; then
            TEXT="❌ Deploy упал%0A${{ github.repository }} @ ${{ github.ref_name }}%0A$RUN_URL"
          elif [ "$VERIFY" != "success" ]; then
            TEXT="❌ Smoke не прошёл%0A${{ github.repository }} @ ${{ github.ref_name }}%0A$RUN_URL"
          else
            TEXT="✅ Деплой успешен%0A${{ github.repository }} @ ${{ github.ref_name }}%0AActor: ${{ github.actor }}%0AVersion: sha-${{ github.sha }}"
          fi
          
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
           -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
           -d "text=$TEXT" \
           -d "disable_web_page_preview=true")
  
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"ok":true' || { echo "Telegram API rejected"; exit 1; }